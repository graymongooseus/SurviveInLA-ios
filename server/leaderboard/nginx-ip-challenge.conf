# Only handles HTTP requests addressed to the leaderboard IP.
# Named sites and their TLS listeners retain their existing configuration.
server {
    listen 80;
    server_name 2.24.206.66;
    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
    }
    location / {
        return 404;
    }
}
