# This VPS already uses 80/443. Its Nginx forwards HTTP-01 to the loopback challenge port.
services:
  caddy-ip:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      LEADERBOARD_IP: ${LEADERBOARD_IP:?Set LEADERBOARD_IP in .env}
    ports:
      - "18443:443"
      - "127.0.0.1:18081:80"
    volumes:
      - ./Caddyfile.ip:/etc/caddy/Caddyfile:ro
      - caddy_ip_data:/data
      - caddy_ip_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_ip_data:
  caddy_ip_config:
